services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mib
      POSTGRES_USER: mib
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mibcreator}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mib -d mib"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://mib:${POSTGRES_PASSWORD:-mibcreator}@db:5432/mib
      # Change SECRET_KEY in production (any long random string).
      SECRET_KEY: ${SECRET_KEY:-please-change-me-to-a-long-random-string}
      # Initial administrator account, created on first start only.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    ports:
      # Web UI + API. Point your Apache vhost proxy at http://localhost:8082/
      - "8082:8080"

volumes:
  dbdata:
